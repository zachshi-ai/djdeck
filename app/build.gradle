plugins { id 'com.android.application' }

android {
    namespace 'com.zach.djdeck'
    compileSdk 34

    defaultConfig {
        applicationId "com.zach.djdeck"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig false }
}
